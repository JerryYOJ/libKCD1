name: Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    env:
      BUILD_DIR: RE/.buildenv/build
      VCPKG_DEFAULT_TRIPLET: x64-windows-static-md

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ runner.temp }}/vcpkg
          vcpkgGitCommitId: 'a34c873a9717a888f58dc05268dea15592c2f0ff'

      - name: Configure
        run: >
          cmake -S RE/.buildenv -B ${{ env.BUILD_DIR }}
          -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_TOOLCHAIN_FILE=${{ runner.temp }}/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build
        run: cmake --build ${{ env.BUILD_DIR }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          find "$BUILD_DIR" -maxdepth 3 \( -name '*.dll' -o -name '*.pdb' \) \
            ! -path '*/vcpkg*' ! -path '*/CMakeFiles/*' \
            -exec cp {} artifacts/ \;
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kcd-plugins-${{ github.sha }}
          path: artifacts/
          retention-days: 30
